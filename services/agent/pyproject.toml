[project]
name = "gestion-consumo-agent"
version = "0.1.0"
description = "Agente local: lee el enchufe por LAN, guarda en cola SQLite y envía a la API"
requires-python = ">=3.12"
dependencies = [
    "tinytuya>=1.17",
    "httpx>=0.27",
    "websockets>=13",  # canal de comandos con la API (/ws/agente)
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Para construir el programa de Mac (services/agent/instalador/construir_mac.sh)
instalador = ["rumps>=0.4; sys_platform == 'darwin'", "pyinstaller>=6"]

[project.scripts]
agente = "agent.principal:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
