[project]
name = "gestion-consumo-api"
version = "0.1.0"
description = "API de gestión de consumo energético (Reto 2)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.9",
    "apscheduler>=3.10,<4",  # tareas programadas dentro del proceso de la API
    "httpx>=0.27",  # llamadas a Google (y a Tuya Cloud / Expo Push más adelante)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
