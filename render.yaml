# Blueprint de Render para la API. Neon aporta la base: DATABASE_URL se pega a mano en el panel.
services:
  - type: web
    name: gestion-consumo-api
    runtime: python
    region: oregon
    plan: free
    rootDir: services/api
    buildCommand: pip install .
    # Las migraciones corren al arrancar: el plan gratuito no tiene preDeployCommand.
    # Migraciones y datos de referencia (tarifas EPM y equivalencias; son idempotentes) al arrancar, sin depender de la red de nadie.
    startCommand: alembic upgrade head && python seeds/tarifas.py && python seeds/equivalencias.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /salud
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Inicio de sesión con Google (cliente OAuth "Aplicación web"). Sin ellos el botón de Google responde 503.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
