# Blueprint de Render para la API. Neon aporta la base: DATABASE_URL se pega a mano en el panel.
services:
  - type: web
    name: gestion-consumo-api
    runtime: python
    region: oregon
    plan: free
    rootDir: services/api
    buildCommand: pip install .
    # Las migraciones corren al arrancar: el plan gratuito no tiene preDeployCommand.
    # Las migraciones corren al arrancar; los datos de referencia (tarifas, equivalencias) los carga la propia API.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /salud
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Cifra las claves locales de los enchufes guardadas en la base (ADR 0008). Si se cambia, las claves se vuelven a pedir a Tuya.
      - key: CLAVE_MAESTRA
        generateValue: true
      # Inicio de sesión con Google (cliente OAuth "Aplicación web"). Sin ellos el botón de Google responde 503.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
